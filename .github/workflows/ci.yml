name: CI Pipeline - Node Task Manager

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: docker build -t myapp-repo .

      # ----- Push to Docker Hub -----
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push to Docker Hub
        run: |
          docker tag myapp-repo:latest ${{ secrets.DOCKERHUB_USERNAME }}/myapp-repo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-repo:latest

      # ----- Push to AWS ECR -----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1  # ✅ Updated to your actual region

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push to ECR
        run: |
          docker tag myapp-repo:latest ${{ steps.login-ecr.outputs.registry }}/myapp-repo:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/myapp-repo:latest
